<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">E-BlackTV — Code. Create. Repeat.</title>
  <desc id="desc">An orange and charcoal developer banner with a geometric E monogram. Web, mobile and automation.</desc>
  <defs>
