    <text x="1152" y="55" text-anchor="end" fill="#a5ad9c" font-family="'SFMono-Regular',Consolas,monospace" font-size="15">&lt;/&gt;</text>
    <text x="42" y="216" fill="#f6f2e9" font-family="Impact,'Arial Narrow',sans-serif" font-size="128" letter-spacing="-1">E-BLACKTV</text>
